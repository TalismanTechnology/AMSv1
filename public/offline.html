<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" />
    <title>Offline · AskMySchool</title>
    <style>
      @font-face {
        font-family: "Yeseva One";
        src: url("/fonts/YesevaOne-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Josefin Sans";
        src: url("/fonts/JosefinSans-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Josefin Sans";
        src: url("/fonts/JosefinSans-SemiBold.ttf") format("truetype");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #faf8f5;
        color: #2d3a2e;
        font-family: "Josefin Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 400;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        margin: 20px 0 8px;
        font-family: "Yeseva One", Georgia, serif;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.5;
        color: #4f5c50;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 10px 20px;
        background: #2d3a2e;
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>AskMySchool needs an internet connection. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
